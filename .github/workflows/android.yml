name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > extracted/DeutschA1Premium/gradle.properties
          echo "android.enableJetifier=true" >> extracted/DeutschA1Premium/gradle.properties

      - name: Build APK
        working-directory: extracted/DeutschA1Premium
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeutschA1Premium-APK
          path: extracted/DeutschA1Premium/app/build/outputs/apk/debug/app-debug.apk
